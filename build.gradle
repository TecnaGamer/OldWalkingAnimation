import bs.ModLoader
import bs.SemverUtils
import groovy.json.JsonOutput
import groovy.json.JsonSlurper
import org.apache.ivy.osgi.util.Version

import java.nio.file.Files
import java.nio.file.StandardCopyOption

import static bs.ModLoader.*

plugins {
    id 'java'
}

group = project.properties.mod_package
// Always suffix the per-version inner jar's mod version with the MC version. Without this,
// every inner jar in the multi-version bundle ends up with id=oldwalkinganimation version=2.0.0,
// which fabric-loader 0.16.x dedupes - leaving one arbitrarily-picked candidate's depends to
// drive the entire mod resolution (e.g. picks the 1.20.6 jar's `=1.20.6` dep on a 1.20.5 game).
version = "${rootProject.properties.mod_version}+${project.properties.minecraft}"
ModLoader loader = ModLoader.fromProject(project)
base.archivesName = "${rootProject.properties.mod_id}-$project.properties.minecraft-$loader.friendlyName"

def packageJar = tasks.create("packageJar", Copy.class) {
    into("${rootProject.layout.buildDirectory.get()}/libs/${E.p["mod_version"]}")
}


//// Copy built jar to root project's build/libs
//tasks.named("build") {
//    doLast {
//        def targetDir = layout.projectDirectory.dir("../../build/libs").asFile
//        layout.projectDirectory.dir("build/libs").asFile.listFiles()?.forEach { it.copyTo(targetDir.resolve(it.name), true) }
//    }
//}

project.ext["loom.platform"] = loader.friendlyName

tasks.named("compileJava").configure { dependsOn("setupChiseledBuild") }
tasks.named("processResources").configure { dependsOn("setupChiseledBuild") }
afterEvaluate {
    def chiseledSrc = layout.buildDirectory.dir("chiseledSrc/main/java").get().asFile
    def chiseledRes = layout.buildDirectory.dir("chiseledSrc/main/resources").get().asFile
    sourceSets.main.java.setSrcDirs([chiseledSrc])
    sourceSets.main.resources.setSrcDirs([chiseledRes])
}

repositories {
    mavenCentral()
    // for Mod Menu
    maven { url "https://maven.shedaniel.me/" }
    maven {
        url = "https://maven.terraformersmc.com/releases"
    }
    maven {
        url "https://maven.nucleoid.xyz/"
        name "Nucleoid"
    }
    // For NeoForge
    maven {
        url = "https://maven.neoforged.net/releases"
    }
    // For NeoForge PRs
    if (project.properties.neoforge_pr) {
        maven {
            url "https://prmaven.neoforged.net/NeoForge/pr$project.properties.neoforge_pr"
            content {
                includeModule("net.neoforged", "neoforge")
            }
        }
    }
    // For Patchment mappings
//    if (project.properties.parchment_version) {
//        maven {
//            name = 'ParchmentMC'
//            url = 'https://maven.parchmentmc.org'
//        }
//    }
    // For Forge
    maven {
        url = "https://maven.minecraftforge.net/"
    }
    //MidnightLib
    maven {
        url = "https://api.modrinth.com/maven"
    }
    maven { url = "https://jitpack.io" }

}
boolean useNeogradle = loader == NEOFORGE && stonecutter.eval(minecraft, ">=1.21")
project.ext["useNeogradle"] = useNeogradle
if (useNeogradle) {
    apply plugin: 'net.neoforged.gradle.userdev'
} else if (stonecutter.eval(minecraft, ">=26.1")) {
    apply plugin: 'net.fabricmc.fabric-loom'
} else {
    apply plugin: 'dev.architectury.loom'
}
stonecutter.const("fabric", loader == FABRIC)
stonecutter.const("forge", loader == FORGE)
stonecutter.const("neoforge", loader == NEOFORGE)
if (stonecutter.eval(minecraft, ">=26.1")) {
    System.out.println("Java 25")
    java {
        sourceCompatibility = JavaVersion.VERSION_25
        targetCompatibility = JavaVersion.VERSION_25
        toolchain {
            languageVersion = JavaLanguageVersion.of(25)
        }
    }
} else if (stonecutter.eval(minecraft, ">=1.20.5")) {
    System.out.println("Java 21")
    java {
        sourceCompatibility = JavaVersion.VERSION_21
        targetCompatibility = JavaVersion.VERSION_21
        toolchain {
            languageVersion = JavaLanguageVersion.of(21)
        }
    }
} else if (stonecutter.eval(minecraft, ">=1.17")) {
    System.out.println("Java 17")
    java {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
        toolchain {
            languageVersion = JavaLanguageVersion.of(17)
        }
    }
} else {
    System.out.println("Java 8")
    java {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
        toolchain {
            languageVersion = JavaLanguageVersion.of(8)
        }
    }
}

if (!useNeogradle) {
    loom {

        runConfigs.all {
            ideConfigGenerated true // Run configurations are not created for subprojects by default
            runDir "../../run" // Use a shared run folder and just create separate worlds
        }


        // 1.20.x-neoforge uses architectury-loom + mojmap, where the empty `named`-namespace
        // access widener trips over the remapper ("Namespace (named) does not match current
        // runtime namespace (unused)"). Skip the AW entirely for that combination.
        boolean skipAw = loader == NEOFORGE && stonecutter.eval(minecraft, ">=1.20.2") && !useNeogradle
        if (!skipAw && !stonecutter.eval(minecraft, ">=26.1")) {
            File file = project.buildDir.toPath().resolve("chiseledSrc/main/resources/${E.p.mod_id}.accesswidener").toFile()
            if (file.exists()) {
                accessWidenerPath = file
            } else {
                project.logger.warn("Access widener file not generated yet!")
            }
        }
    }
    if (loader == NEOFORGE && stonecutter.eval(minecraft, ">=1.20.2") && !useNeogradle) {
        // Drop the header-only AW from the chiseled output before processResources copies it.
        tasks.named("processResources") {
            dependsOn "setupChiseledBuild"
            doFirst {
                File chiseledAw = project.buildDir.toPath().resolve("chiseledSrc/main/resources/${E.p.mod_id}.accesswidener").toFile()
                if (chiseledAw.exists()) chiseledAw.delete()
            }
        }
    }
    // Use vanilla mixin on Forge
    if (loader == FORGE) {
        loom {
            forge {
                useCustomMixin = false

                mixinConfig "${E.p.mod_id}.mixins.json"
            }
        }
    }
}

dependencies {

    if (!useNeogradle) {
        minecraft "net.minecraft:minecraft:$project.properties.minecraft"
    }
    if (!useNeogradle && !stonecutter.eval(minecraft, ">=26.1")) {
        // 1.20.x-neoforge: yarn 1.20.x has unfixable srg->yarn name conflicts under tiny-remapper
        // (e.g. chl/[getInventory, gZ] both -> getInventory), so this path uses official Mojang
        // mappings instead. The neoforge source branches in the codebase already use mojmap names.
        if (loader == NEOFORGE && stonecutter.eval(minecraft, ">=1.20.2")) {
            mappings loom.officialMojangMappings()
        } else {
            mappings "net.fabricmc:yarn:$project.properties.yarn_mappings:v2"
        }
    }

//
//    if (project.properties.parchment_version) {
//        mappings loom.layered {
//            officialMojangMappings()
//            parchment("org.parchmentmc.data:parchment-${project.properties.parchment_version}@zip")
//        }
//    } else {
//        mappings loom.officialMojangMappings()
//    }
    if (loader == FABRIC) {
        def modImpl = stonecutter.eval(minecraft, ">=26.1") ? "implementation" : "modImplementation"
        def modCompile = stonecutter.eval(minecraft, ">=26.1") ? "compileOnly" : "modCompileOnly"
        def modRuntime = stonecutter.eval(minecraft, ">=26.1") ? "runtimeOnly" : "modLocalRuntime"
        def modApiCfg = stonecutter.eval(minecraft, ">=26.1") ? "api" : "modApi"

        add(modImpl, "net.fabricmc:fabric-loader:$project.properties.fabricloader")
        if (!stonecutter.eval(minecraft, ">=26.1")) {
            add(modCompile, "com.terraformersmc:modmenu:$project.properties.modmenu") {
                exclude group: "net.fabricmc"
                exclude group: "net.fabricmc.fabric-api"
            }
        } else {
            def modmenuJar = rootProject.file("dev-deps/modmenu-18.0.0-alpha.8.jar")
            if (modmenuJar.exists()) {
                add(modCompile, files(modmenuJar))
                add(modRuntime, files(modmenuJar))
            }
        }
        if (project.properties.fabric_api_modules == "*") {
            if (project.properties.include_fabric_api_modules == "true") {
                throw new RuntimeException("You can't include the entirety of Fabric API!")
            }
            add(modApiCfg, "net.fabricmc.fabric-api:fabric-api:$project.properties.fabric_api_version")
        } else {
            for (String module in project.properties.fabric_api_modules.split(",") as String[]) {
                var dep = fabricApi.module(module, "$project.properties.fabric_api_version")
                add(modApiCfg, dep)
                if (project.properties.include_fabric_api_modules == "true") {
                    include(dep)
                }
            }
        }
        if (stonecutter.eval(minecraft, ">=26.1")) {
            def runtimeModules = project.properties.fabric_api_runtime_modules
            if (runtimeModules) {
                for (String module in runtimeModules.toString().split(",") as String[]) {
                    add(modRuntime, fabricApi.module(module, "$project.properties.fabric_api_version"))
                }
            }
        }
    } else if (loader == FORGE) {
        implementation 'com.google.code.gson:gson:2.8.8'

        forge "net.minecraftforge:forge:$project.properties.forge"
//        if (stonecutter.eval(minecraft, "<=1.14.4")) {
//            modApi "me.shedaniel.cloth:config-2:1.8"
//        } else {
//            modApi "me.shedaniel.cloth:cloth-config-forge:$project.properties.cloth_config_version"
//        }
    } else if (loader == NEOFORGE) {
        if (useNeogradle) {
            implementation "net.neoforged:neoforge:$project.properties.neoforge"
        } else {
            neoForge "net.neoforged:neoforge:$project.properties.neoforge"
        }
        //modApi "me.shedaniel.cloth:cloth-config-neoforge:$project.properties.cloth_config_version"
    }
    // MidnightConfig is vendored in src/main/java/eu/midnightdust/lib/config/MidnightConfig.java for all versions
}

