jar {
    from(project.file("LICENSE")) {
        rename { "${it}_${archivesBaseName}"}
    }
}

processResources {
    def dep = project.properties.minecraft_dependency.toString()
    if (loader == FORGE || loader == NEOFORGE) {
        dep = SemverUtils.convertSemverPredicateToMavenPredicate(dep)
    }

    inputs.property "forgeid", loader == NEOFORGE ? "neoforge" : "forge"
    inputs.property "minecraft_dependency", dep
    inputs.property "mod_version", version
    inputs.property "mod_id", project.properties.mod_id
    inputs.property "mod_display_name", project.properties.mod_display_name
    inputs.property "mod_description", project.properties.mod_description
    inputs.property "homepage_url", project.properties.homepage_url
    inputs.property "sources_url", project.properties.sources_url
    inputs.property "issue_tracker_url", project.properties.issue_tracker_url
    inputs.property "license", project.properties.license
    inputs.property "fabricloader", project.properties.fabricloader
    inputs.property "contributors", project.properties.mod_contributors.toString()
    inputs.property "authors", project.properties.mod_authors.toString()
    inputs.property "fabric_api_modules", project.properties.fabric_api_modules

    filesMatching(["fabric.mod.json", "META-INF/mods.toml", "quilt.mod.json"]) {
        def map = [
                "forgeid": loader == NEOFORGE ? "neoforge" : "forge",
                "minecraft": dep,
                "mod_version": version,
                "mod_id": project.properties.mod_id,
                "mod_display_name": project.properties.mod_display_name,
                "mod_description": project.properties.mod_description,
                "homepage_url": project.properties.homepage_url,
                "sources_url": project.properties.sources_url,
                "issue_tracker_url": project.properties.issue_tracker_url,
                "license": project.properties.license,
                "fabricloader": project.properties.fabricloader,
                "contributors": project.properties.mod_contributors.toString().split(","),
                "authors": project.properties.mod_authors.toString().split(",")
        ]
        expand map
    }
    doLast {
        if (loader == NEOFORGE) {
            def mcExact = project.properties.minecraft.toString()
            // FML 1.x (NeoForge 20.2/20.3) requires the legacy `mandatory = true` field; FML 2.x+
            // accepts `type = "required"`. Emit both for backward compatibility - newer FMLs ignore
            // the legacy field and older FMLs ignore `type`.
            def depFields = stonecutter.eval(minecraft, "<1.20.4")
                    ? "mandatory = true\ntype = \"required\""
                    : "type = \"required\""
            fileTree(dir: outputs.files.asPath, include: "META-INF/mods.toml").each { File file ->
                file.text += "\n\n[[mixins]]\nconfig = \"${project.properties.mod_id}.mixins.json\""
                file.text += "\n\n[[dependencies.${project.properties.mod_id.toLowerCase()}]]\nmodId = \"minecraft\"\n${depFields}\nversionRange = \"[${mcExact}]\"\nordering = \"NONE\"\nside = \"CLIENT\""
            }
            fileTree(dir: outputs.files.asPath, include: "META-INF/mods.toml").each { File file ->
                Files.copy(file.toPath(), java.nio.file.Path.of(outputs.files.asPath).resolve("META-INF/neoforge.mods.toml"), StandardCopyOption.REPLACE_EXISTING)
                // NeoForge 20.2-20.4 (FML 1.x/2.x) only knows mods.toml; 20.5+ uses neoforge.mods.toml.
                // Keeping both for the older versions costs nothing and lets the same inner jar load
                // on both old and new NeoForge runtimes.
                if (stonecutter.eval(minecraft, ">=1.20.5")) {
                    file.delete()
                }
            }
        }
        // Strip 26.1+-only mixins from the mixins.json on older versions so the mixin loader doesn't crash on missing classes.
        if (!stonecutter.eval(minecraft, ">=26.1")) {
            def newerOnlyMixins = [
                    "AbstractFelineModelAccessor",
                    "OwaLivingRenderStateMixin",
                    "OwaRendererCaptureMixin"
            ] as Set
            fileTree(dir: outputs.files.asPath, include: "${E.p.mod_id}.mixins.json").each { File file ->
                def parsed = new JsonSlurper().parse(file)
                if (parsed.client instanceof List) {
                    parsed.client = parsed.client.findAll { !newerOnlyMixins.contains(it) }
                }
                if (parsed.mixins instanceof List) {
                    parsed.mixins = parsed.mixins.findAll { !newerOnlyMixins.contains(it) }
                }
                if (parsed.server instanceof List) {
                    parsed.server = parsed.server.findAll { !newerOnlyMixins.contains(it) }
                }
                file.text = JsonOutput.prettyPrint(JsonOutput.toJson(parsed))
            }
        }
        if (loader == FABRIC) {
            fileTree(dir: outputs.files.asPath, include: "fabric.mod.json").each { File file ->
                def parse = new JsonSlurper().parse(file)
                def fModulesString = project.properties.fabric_api_modules
                if (fModulesString == "*") {
                    parse.depends["fabric"] = ">=" + project.properties.fabric_api_version
                } else {
                    def fModules = fModulesString.split(",")
                    for (String s in fModules) {
                        // ^ means until the next major
                        parse.depends[s] = "^" + fabricApi.module(s, project.properties.fabric_api_version).getVersion()
                    }
                }
                parse.depends["minecraft"] = "=" + project.properties.minecraft
                if (stonecutter.eval(minecraft, ">=26.1")) {
                    parse.remove("accessWidener")
                }
                file.text = JsonOutput.prettyPrint(JsonOutput.toJson(parse))
            }
            if (stonecutter.eval(minecraft, ">=26.1")) {
                fileTree(dir: outputs.files.asPath, include: "${E.p.mod_id}.accesswidener").each { File file ->
                    file.delete()
                }
                def stubMixins = [
                        "LivingEntityMixin"
                ] as Set
                fileTree(dir: outputs.files.asPath, include: "${E.p.mod_id}.mixins.json").each { File file ->
                    def parsed = new JsonSlurper().parse(file)
                    if (parsed.client instanceof List) {
                        parsed.client = parsed.client.findAll { !stubMixins.contains(it) }
                    }
                    if (parsed.mixins instanceof List) {
                        parsed.mixins = parsed.mixins.findAll { !stubMixins.contains(it) }
                    }
                    if (parsed.server instanceof List) {
                        parsed.server = parsed.server.findAll { !stubMixins.contains(it) }
                    }
                    file.text = JsonOutput.prettyPrint(JsonOutput.toJson(parsed))
                }
            }
        }
    }

    if (loader == FORGE || loader == NEOFORGE) {
        exclude 'fabric.mod.json'
    } else if (loader == FABRIC) {
        exclude 'META-INF/mods.toml', 'META-INF/accesstransformer.cfg', 'pack.mcmeta'
    }
}

if (!useNeogradle && !stonecutter.eval(minecraft, ">=26.1")) {
    remapJar {
        // 1.20.x-neoforge skips the AW (see comment in the loom block above), so don't try to
        // convert it into a forge AccessTransformer either - the file isn't there.
        boolean skipAw = loader == NEOFORGE && stonecutter.eval(minecraft, ">=1.20.2") && !useNeogradle
        if ((loader == FORGE || loader == NEOFORGE) && !skipAw) {
            atAccessWideners.add("${project.properties.mod_id}.accesswidener")
        }
    }
}

if (loader == FORGE) {
    configurations.all {
        resolutionStrategy {
            force 'net.sf.jopt-simple:jopt-simple:5.0.4'
        }
    }
}

if (loader == FABRIC) {
    configurations.all {
        resolutionStrategy {
            force("net.fabricmc:fabric-loader:$fabricloader")
        }
    }
}

afterEvaluate {
    def finalJar = (useNeogradle || stonecutter.eval(minecraft, ">=26.1")) ? tasks.named("jar") : tasks.named("remapJar")
    packageJar.dependsOn(finalJar)
    packageJar.from(finalJar.map { it.archiveFile })
    build.finalizedBy(packageJar)
}